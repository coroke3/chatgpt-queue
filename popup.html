<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT Queue</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/icon48.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon16.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gen-interface-jp@0.8.0/cdn/300.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gen-interface-jp@0.8.0/cdn/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gen-interface-jp@0.8.0/cdn/500.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gen-interface-jp@0.8.0/cdn/600.css">
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #f9f9fb;
      --border: #e6e6e8;
      --border-subtle: #f0f0f2;
      --text: #111111;
      --text-muted: #737373;
      --btn-primary: #111111;
      --btn-primary-text: #ffffff;
      --btn-primary-hover: #262626;
      --btn-secondary: #f4f4f5;
      --btn-secondary-hover: #eaeaea;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1e;
        --card-bg: #282828;
        --border: #383838;
        --border-subtle: #2d2d2d;
        --text: #ececec;
        --text-muted: #9e9e9e;
        --btn-primary: #ececec;
        --btn-primary-text: #111111;
        --btn-primary-hover: #ffffff;
        --btn-secondary: #2c2c2c;
        --btn-secondary-hover: #363636;
        color-scheme: dark;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 300px;
      padding: 14px;
      font-family: 'Gen Interface JP', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: var(--cgq-font-weight, 300);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      display: block;
    }

    .title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .badge {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--btn-secondary);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 12px;
      min-width: 24px;
      text-align: center;
    }

    .btn-dashboard {
      width: 100%;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: var(--btn-primary);
      color: var(--btn-primary-text);
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, opacity 0.15s ease;
      font-family: inherit;
    }

    .btn-dashboard:hover {
      background: var(--btn-primary-hover);
    }

    .divider {
      height: 1px;
      background: var(--border-subtle);
      margin: 12px 0;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .section-status {
      font-size: 11px;
      font-weight: 500;
      color: var(--text);
    }

    textarea {
      width: 100%;
      height: 60px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      font-weight: var(--cgq-font-weight, 300);
      resize: none;
      line-height: 1.45;
      transition: border-color 0.15s ease;
      display: block;
    }

    textarea:focus {
      outline: none;
      border-color: var(--text);
    }

    textarea:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .input-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
      gap: 8px;
    }

    .input-hint {
      flex: 1;
      min-width: 0;
      font-size: 10px;
      color: var(--text-muted);
    }

    .btn-add {
      flex-shrink: 0;
      white-space: nowrap;
      padding: 5px 12px;
      background: var(--btn-primary);
      color: var(--btn-primary-text);
      border: none;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s ease;
      font-family: inherit;
    }

    .btn-add:hover:not(:disabled) {
      background: var(--btn-primary-hover);
    }

    .btn-add:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .footer-links {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .btn-link {
      flex: 1;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: var(--btn-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 11px;
      font-weight: 400;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease;
      font-family: inherit;
    }

    .btn-link:hover {
      background: var(--btn-secondary-hover);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon48.png" alt="" class="logo">
      <span class="title">ChatGPT Queue</span>
    </div>
    <span class="badge" id="queue-count">0</span>
  </div>

  <button class="btn-dashboard" id="btn-open-dashboard" type="button">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="7"></rect>
      <rect x="14" y="3" width="7" height="7"></rect>
      <rect x="14" y="14" width="7" height="7"></rect>
      <rect x="3" y="14" width="7" height="7"></rect>
    </svg>
    ダッシュボードを開く
  </button>

  <div class="divider"></div>

  <div class="section-header">
    <span class="section-label">現在のタブ</span>
    <span class="section-status" id="stat-items">未接続</span>
  </div>

  <textarea id="popup-input" placeholder="プロンプトを入力..."></textarea>

  <div class="input-actions">
    <span class="input-hint">Enterで送信 / Ctrl+Enterでキュー追加</span>
    <button class="btn-add" id="btn-add" type="button">＋ キュー</button>
  </div>

  <div class="footer-links">
    <button class="btn-link" id="btn-open-chatgpt" type="button">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
      ChatGPT
    </button>
    <button class="btn-link" id="btn-open-gemini" type="button">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
      Gemini
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
